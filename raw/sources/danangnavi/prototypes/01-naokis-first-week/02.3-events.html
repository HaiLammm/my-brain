<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DaNangNavi — Events & Meetups</title>
  <link rel="stylesheet" href="shared/design-tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .page-container { max-width: 1280px; margin: 0 auto; padding: 0 24px 80px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; padding: 32px 0 16px; }
    .page-header h1 { font-family: var(--font-headlines); font-size: 28px; font-weight: 700; color: var(--color-text); }

    /* View toggle */
    .view-toggle { display: flex; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
    .view-toggle-btn { font-family: var(--font-ui); font-size: 13px; font-weight: 500; padding: 7px 16px; border: none; background: none; cursor: pointer; color: var(--color-text-secondary); transition: all var(--transition-fast); }
    .view-toggle-btn.active { background: var(--color-primary); color: #FFF; }

    /* Filters */
    .filter-row { display: flex; gap: 8px; padding: 16px 0; flex-wrap: wrap; }
    .filter-chip { font-family: var(--font-ui); font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-secondary); cursor: pointer; transition: all var(--transition-fast); }
    .filter-chip:hover { border-color: var(--color-accent); }
    .filter-chip.active { border-color: var(--color-secondary); background: rgba(255,107,74,0.1); color: var(--color-secondary); font-weight: 600; }

    /* Event cards */
    .events-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 16px; }
    .event-card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; cursor: pointer; transition: box-shadow var(--transition-normal); }
    .event-card:hover { box-shadow: var(--shadow-card-hover); }
    .event-card-photo { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; }
    .event-card-body { padding: 20px; }
    .event-card-title { font-family: var(--font-headlines); font-size: 18px; font-weight: 700; color: var(--color-text); margin-bottom: 8px; }
    .event-card-meta { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 12px; }
    .event-card-attendees { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .avatar-stack { display: flex; }
    .avatar-stack-item { width: 28px; height: 28px; border-radius: 50%; background: #D1D5DB; border: 2px solid #FFF; margin-left: -8px; }
    .avatar-stack-item:first-child { margin-left: 0; }
    .avatar-stack-count { font-size: 13px; color: var(--color-accent); font-weight: 600; }
    .event-card-host { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 12px; }
    .event-card-host .host-senpai { color: var(--color-accent); font-weight: 600; }
    .newcomer-badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--color-success); background: rgba(39,174,96,0.1); padding: 3px 10px; border-radius: var(--radius-full); margin-bottom: 12px; }
    .event-card-footer { display: flex; align-items: center; justify-content: space-between; }
    .event-price { font-size: 14px; font-weight: 600; color: var(--color-text); }
    .event-join-btn { font-family: var(--font-ui); font-size: 14px; font-weight: 700; color: #FFF; background: var(--color-secondary); border: none; padding: 10px 24px; border-radius: var(--radius-full); cursor: pointer; transition: opacity var(--transition-fast); }
    .event-join-btn:hover { opacity: 0.9; }
    .event-join-btn.joined { background: var(--color-success); }

    /* Event Detail Panel */
    .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; justify-content: flex-end; }
    .detail-overlay.open { display: flex; }
    .detail-panel { width: 560px; max-width: 90vw; height: 100vh; background: var(--color-bg); overflow-y: auto; box-shadow: -4px 0 24px rgba(0,0,0,0.15); animation: slideIn 300ms ease; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .detail-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; background: rgba(0,0,0,0.4); color: #FFF; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 2; display: flex; align-items: center; justify-content: center; }
    .detail-hero { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; font-size: 56px; position: relative; }
    .detail-body { padding: 24px; }
    .detail-title { font-family: var(--font-headlines); font-size: 22px; font-weight: 700; color: var(--color-text); margin-bottom: 16px; }
    .detail-meta-row { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--color-text); margin-bottom: 20px; }
    .detail-desc { font-size: 14px; color: var(--color-text); line-height: 1.6; margin-bottom: 20px; }
    .detail-host { display: flex; align-items: center; gap: 12px; padding: 16px; background: rgba(46,196,182,0.06); border-radius: var(--radius); margin-bottom: 20px; }
    .detail-host-avatar { width: 44px; height: 44px; border-radius: 50%; background: #D1D5DB; flex-shrink: 0; }
    .detail-host-name { font-weight: 600; font-size: 14px; color: var(--color-text); }
    .detail-host-bio { font-size: 13px; color: var(--color-text-secondary); }
    .newcomer-note { padding: 14px 16px; background: rgba(39,174,96,0.06); border: 1px solid rgba(39,174,96,0.15); border-radius: var(--radius); font-size: 14px; color: var(--color-text); margin-bottom: 20px; }
    .detail-attendees { margin-bottom: 20px; }
    .detail-attendees-title { font-size: 14px; font-weight: 600; color: var(--color-text); margin-bottom: 8px; }
    .detail-avatar-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .detail-avatar-item { width: 36px; height: 36px; border-radius: 50%; background: #D1D5DB; }
    .detail-actions { display: flex; flex-direction: column; gap: 10px; }
    .detail-join-btn { width: 100%; padding: 14px; font-family: var(--font-ui); font-size: 16px; font-weight: 700; color: #FFF; background: var(--color-secondary); border: none; border-radius: var(--radius-full); cursor: pointer; }
    .detail-secondary-actions { display: flex; gap: 12px; justify-content: center; }
    .detail-action-link { font-size: 13px; color: var(--color-text-secondary); background: none; border: none; cursor: pointer; }
    .detail-action-link:hover { color: var(--color-accent); }

    /* Confirmation Modal */
    .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
    .confirm-overlay.open { display: flex; }
    .confirm-modal { background: var(--color-surface); border-radius: var(--radius-lg); padding: 40px; text-align: center; max-width: 400px; width: 90%; }
    .confirm-icon { font-size: 48px; margin-bottom: 16px; }
    .confirm-title { font-family: var(--font-headlines); font-size: 20px; font-weight: 700; color: var(--color-text); margin-bottom: 8px; }
    .confirm-text { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 24px; line-height: 1.5; }
    .confirm-actions { display: flex; flex-direction: column; gap: 10px; }
    .confirm-primary { font-family: var(--font-ui); font-size: 14px; font-weight: 600; color: var(--color-accent); background: none; border: 2px solid var(--color-accent); padding: 10px 24px; border-radius: var(--radius-full); cursor: pointer; }
    .confirm-close { font-size: 14px; color: var(--color-text-secondary); background: none; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <div class="page-container">
    <div class="page-header">
      <h1>🎉 Events & Meetups</h1>
      <div class="view-toggle">
        <button class="view-toggle-btn active" data-view="list">List</button>
        <button class="view-toggle-btn" data-view="calendar">Calendar</button>
      </div>
    </div>

    <div class="filter-row" id="filter-row"></div>
    <div class="events-grid" id="events-grid"></div>
  </div>

  <!-- Detail Panel -->
  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-panel" id="detail-panel"></div>
  </div>

  <!-- Confirmation Modal -->
  <div class="confirm-overlay" id="confirm-overlay"></div>

  <script type="module">
    import { renderTopNav } from './components/top-nav.js';
    const res = await fetch('./data/demo-data.json');
    const data = await res.json();

    renderTopNav(document.getElementById('nav-container'), { activePage: 'community' });

    // Filters
    const filters = ['This Week', 'Weekend', 'Dining', 'Outdoor', 'Social', 'Newcomers Welcome'];
    const filterRow = document.getElementById('filter-row');
    filters.forEach(f => {
      const chip = document.createElement('button');
      chip.className = 'filter-chip';
      chip.textContent = f;
      chip.addEventListener('click', () => {
        chip.classList.toggle('active');
        console.log('[Events] Filter:', f);
      });
      filterRow.appendChild(chip);
    });

    // Event colors
    const eventColors = ['rgba(255,107,74,0.15)', 'rgba(46,196,182,0.15)', 'rgba(27,42,74,0.1)', 'rgba(242,153,74,0.15)'];
    const eventEmojis = ['🔥', '☕', '🥾', '🍽️'];

    // Events grid
    const grid = document.getElementById('events-grid');
    data.events.forEach((e, i) => {
      const host = data.senpai.find(s => s.id === e.host) || data.senpai[0];
      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <div class="event-card-photo" style="background:${eventColors[i]};">${eventEmojis[i]}</div>
        <div class="event-card-body">
          <div class="event-card-title">${e.title}</div>
          ${e.newcomerWelcome ? '<div class="newcomer-badge">Newcomers Welcome</div>' : ''}
          <div class="event-card-meta">
            <span>📅 ${e.date} · ${e.time}</span>
            <span>📍 ${e.location}</span>
          </div>
          <div class="event-card-attendees">
            <div class="avatar-stack">
              <div class="avatar-stack-item"></div><div class="avatar-stack-item"></div><div class="avatar-stack-item"></div>
            </div>
            <span class="avatar-stack-count">${e.attendees} attending</span>
          </div>
          <div class="event-card-host">Hosted by <span class="host-senpai">${host.name} (Senpai)</span></div>
          <div class="event-card-footer">
            <span class="event-price">${e.price}</span>
            <button class="event-join-btn" data-id="${e.id}">Join</button>
          </div>
        </div>
      `;

      // Card click → detail
      card.addEventListener('click', (ev) => {
        if (ev.target.classList.contains('event-join-btn')) return;
        openDetail(e, host);
      });

      // Join button
      card.querySelector('.event-join-btn').addEventListener('click', (ev) => {
        ev.stopPropagation();
        showConfirmation(e);
      });

      grid.appendChild(card);
    });

    // Detail panel
    const overlay = document.getElementById('detail-overlay');
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

    function openDetail(event, host) {
      document.getElementById('detail-panel').innerHTML = `
        <div class="detail-hero" style="background:${eventColors[data.events.indexOf(event)] || eventColors[0]};">
          ${eventEmojis[data.events.indexOf(event)] || '🎉'}
          <button class="detail-close" onclick="document.getElementById('detail-overlay').classList.remove('open')">✕</button>
        </div>
        <div class="detail-body">
          <div class="detail-title">${event.title}</div>
          <div class="detail-meta-row">
            <span>📅 ${event.date} · ${event.time}</span>
            <span>📍 ${event.location}</span>
            <span>💰 ${event.price}</span>
          </div>
          <div class="detail-desc">${event.description}</div>
          <div class="detail-host">
            <div class="detail-host-avatar"></div>
            <div>
              <div class="detail-host-name">${host.name} <span style="color:var(--color-accent);font-size:12px;">(Senpai)</span></div>
              <div class="detail-host-bio">${host.yearsInDanang} years in Da Nang · ${host.role}</div>
            </div>
          </div>
          ${event.newcomerWelcome ? '<div class="newcomer-note">🌟 First-timers very welcome! Come casually and have fun 😊</div>' : ''}
          <div class="detail-attendees">
            <div class="detail-attendees-title">👥 ${event.attendees} attending</div>
            <div class="detail-avatar-row">${Array(Math.min(event.attendees, 8)).fill('<div class="detail-avatar-item"></div>').join('')}</div>
          </div>
          <div class="detail-actions">
            <button class="detail-join-btn" onclick="document.getElementById('detail-overlay').classList.remove('open'); showConfirmation(window._currentEvent)">Join Event</button>
            <div class="detail-secondary-actions">
              <button class="detail-action-link">📤 Share</button>
              <button class="detail-action-link">📅 Add to Calendar</button>
            </div>
          </div>
        </div>
      `;
      window._currentEvent = event;
      overlay.classList.add('open');
    }

    // Confirmation
    const confirmOverlay = document.getElementById('confirm-overlay');
    confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) confirmOverlay.classList.remove('open'); });

    window.showConfirmation = function(event) {
      confirmOverlay.innerHTML = `
        <div class="confirm-modal">
          <div class="confirm-icon">✅</div>
          <div class="confirm-title">You're in! 🎉</div>
          <div class="confirm-text">You've joined "${event.title}" on ${event.date}.<br>We'll send you a reminder before the event.</div>
          <div class="confirm-actions">
            <button class="confirm-primary" onclick="console.log('[Events] Go to profile'); document.getElementById('confirm-overlay').classList.remove('open');">Check in My Page →</button>
            <button class="confirm-close" onclick="document.getElementById('confirm-overlay').classList.remove('open')">Close</button>
          </div>
        </div>
      `;
      overlay.classList.remove('open');
      confirmOverlay.classList.add('open');

      // Update join button
      document.querySelectorAll(`.event-join-btn[data-id="${event.id}"]`).forEach(btn => {
        btn.textContent = 'Joined ✓';
        btn.classList.add('joined');
      });
    };

    console.log('[Events] Loaded');
  </script>
</body>
</html>
