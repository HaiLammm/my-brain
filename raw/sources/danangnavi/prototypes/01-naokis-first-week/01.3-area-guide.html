<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DaNangNavi — Area Guide</title>
  <link rel="stylesheet" href="shared/design-tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .page-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 80px;
      min-height: 100vh;
    }

    /* Section 1: Header */
    .area-header {
      text-align: center;
      padding: 48px 0 16px;
    }
    .area-header h1 {
      font-family: var(--font-headlines);
      font-size: 32px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 8px;
    }
    .area-header p {
      font-size: 16px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
    }
    .area-personalization {
      display: inline-block;
      font-size: 13px;
      color: var(--color-accent);
      background-color: rgba(46,196,182,0.08);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      margin-top: 8px;
    }

    /* Section 2: Map + Cards Layout */
    .area-layout {
      display: grid;
      grid-template-columns: 30% 70%;
      gap: 32px;
      margin-top: 32px;
    }

    /* Map */
    .area-map {
      position: sticky;
      top: 88px;
      align-self: start;
    }
    .map-container {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 24px;
      position: relative;
    }
    .map-svg {
      width: 100%;
      aspect-ratio: 3/4;
    }
    .map-zone {
      cursor: pointer;
      transition: opacity var(--transition-normal);
      opacity: 0.7;
    }
    .map-zone:hover, .map-zone.active {
      opacity: 1;
    }
    .map-zone.active {
      filter: brightness(1.1);
    }
    .map-legend {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--color-text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background-color var(--transition-fast);
    }
    .legend-item:hover, .legend-item.active {
      background-color: rgba(46,196,182,0.08);
      color: var(--color-text);
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Section 3: Area Cards */
    .area-cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .area-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: grid;
      grid-template-columns: 240px 1fr;
      cursor: pointer;
      transition: box-shadow var(--transition-normal), transform var(--transition-normal);
      border: 2px solid transparent;
    }
    .area-card:hover {
      box-shadow: var(--shadow-card-hover);
    }
    .area-card.highlighted {
      border-color: var(--color-accent);
    }
    .area-card-photo {
      width: 100%;
      height: 100%;
      min-height: 200px;
      background-size: cover;
      background-position: center;
    }
    .area-card-body {
      padding: 20px 24px;
    }
    .area-card-name {
      font-family: var(--font-headlines);
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 4px;
    }
    .area-card-tagline {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-bottom: 16px;
    }
    .area-card-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }
    .area-stat {
      font-size: 14px;
      color: var(--color-text);
    }
    .area-stat-icon {
      margin-right: 4px;
    }
    .area-stat-value {
      font-weight: 600;
    }
    .area-card-highlights {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .highlight-tag {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-accent);
      background-color: rgba(46,196,182,0.1);
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }
    .area-card-cta {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .area-card-cta:hover {
      text-decoration: underline;
    }

    /* Section 4: Detail Panel */
    .area-detail-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.4);
      z-index: 100;
      justify-content: flex-end;
    }
    .area-detail-overlay.open {
      display: flex;
    }
    .area-detail-panel {
      width: 560px;
      max-width: 90vw;
      height: 100vh;
      background-color: var(--color-bg);
      overflow-y: auto;
      box-shadow: -4px 0 24px rgba(0,0,0,0.15);
      animation: slideIn 300ms ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .detail-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      background-color: rgba(0,0,0,0.4);
      color: #FFFFFF;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .detail-hero {
      width: 100%;
      height: 200px;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .detail-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(0,0,0,0.6));
    }
    .detail-hero-name {
      position: absolute;
      bottom: 16px;
      left: 20px;
      font-family: var(--font-headlines);
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .detail-body {
      padding: 24px 20px;
    }
    .detail-section {
      margin-bottom: 24px;
    }
    .detail-section-title {
      font-family: var(--font-headlines);
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 12px;
    }
    .detail-quote {
      font-size: 14px;
      font-style: italic;
      color: var(--color-text);
      line-height: 1.5;
      padding: 12px 16px;
      background-color: rgba(46,196,182,0.06);
      border-left: 3px solid var(--color-accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      margin-bottom: 4px;
    }
    .detail-quote-author {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }
    .pros-cons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .pros-list, .cons-list {
      list-style: none;
      font-size: 14px;
      line-height: 1.8;
    }
    .pros-list li::before {
      content: '✅ ';
    }
    .cons-list li::before {
      content: '⚠️ ';
    }
    .price-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .price-table th {
      text-align: left;
      font-weight: 600;
      color: var(--color-text-secondary);
      padding: 8px 0;
      border-bottom: 1px solid var(--color-border);
    }
    .price-table td {
      padding: 8px 0;
      border-bottom: 1px solid var(--color-border);
    }
    .price-table .jpy {
      color: var(--color-accent);
      font-weight: 500;
    }
    .detail-cta-btn {
      display: block;
      width: 100%;
      padding: 14px;
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      background-color: var(--color-secondary);
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      text-align: center;
      transition: opacity var(--transition-fast);
    }
    .detail-cta-btn:hover {
      opacity: 0.9;
    }

    /* Section 5: Senpai Stories */
    .senpai-stories-section {
      margin-top: 48px;
    }
    .senpai-stories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .senpai-story-card {
      background-color: var(--color-surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      padding: 20px;
    }
    .senpai-story-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .senpai-story-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #D1D5DB;
      flex-shrink: 0;
    }
    .senpai-story-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
    }
    .senpai-story-meta {
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .senpai-story-quote {
      font-size: 14px;
      color: var(--color-text);
      line-height: 1.5;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- TopNavBar -->
  <div id="nav-container"></div>

  <div class="page-container">

    <!-- Section 1: Header -->
    <div class="area-header">
      <h1>Da Nang Area Guide</h1>
      <p>Where senpai live and why they recommend it</p>
      <div class="area-personalization" id="personalization"></div>
    </div>

    <!-- Section 2 + 3: Map + Cards Layout -->
    <div class="area-layout">

      <!-- Section 2: Map -->
      <div class="area-map">
        <div class="map-container">
          <svg class="map-svg" viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
            <!-- Da Nang simplified geographic map -->
            <!-- Ocean (east side) -->
            <rect x="245" y="0" width="55" height="380" fill="#E0F4FF" rx="0"/>
            <text x="272" y="190" text-anchor="middle" font-size="9" fill="#87CEEB" opacity="0.8" writing-mode="tb">East Sea 🌊</text>

            <!-- Han River (curves through city, north to south) -->
            <path d="M140 0 C140 80, 155 140, 150 200 C145 260, 140 320, 135 380" stroke="#87CEEB" stroke-width="4" fill="none" opacity="0.6"/>
            <text x="130" y="195" font-size="8" fill="#87CEEB" opacity="0.7" text-anchor="end">Han River</text>

            <!-- Son Tra Peninsula (northeast, jutting into sea) -->
            <path class="map-zone" data-area="son-tra" d="M160 30 L240 20 Q265 40 250 80 L240 120 L160 130 Z" fill="#2EC4B6" rx="8"/>
            <text x="200" y="72" text-anchor="middle" font-size="11" fill="white" font-weight="600" pointer-events="none">Son Tra</text>
            <text x="200" y="86" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.7)" pointer-events="none">🏖️ My Khe Beach</text>

            <!-- Hai Chau (west of river, city center) -->
            <path class="map-zone" data-area="hai-chau" d="M20 100 L130 100 L130 220 L20 220 Z" fill="#1B2A4A" rx="8"/>
            <text x="75" y="155" text-anchor="middle" font-size="12" fill="white" font-weight="600" pointer-events="none">Hai Chau</text>
            <text x="75" y="172" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.7)" pointer-events="none">City Center</text>
            <!-- Workplace marker -->
            <text x="75" y="198" text-anchor="middle" font-size="14" pointer-events="none" id="map-workplace">⭐ Workplace</text>

            <!-- East of Han River (between river and Son Tra/Ngu Hanh Son) -->
            <path class="map-zone" data-area="east-han-river" d="M160 135 L240 125 L240 210 L160 220 Z" fill="#F2994A" rx="6"/>
            <text x="200" y="170" text-anchor="middle" font-size="10" fill="white" font-weight="600" pointer-events="none">East of</text>
            <text x="200" y="183" text-anchor="middle" font-size="10" fill="white" font-weight="600" pointer-events="none">Han River</text>

            <!-- Ngu Hanh Son (southeast, coastal) -->
            <path class="map-zone" data-area="ngu-hanh-son" d="M160 225 L240 215 L240 330 L160 340 Z" fill="#FF6B4A" rx="8"/>
            <text x="200" y="268" text-anchor="middle" font-size="10" fill="white" font-weight="600" pointer-events="none">Ngu Hanh</text>
            <text x="200" y="283" text-anchor="middle" font-size="10" fill="white" font-weight="600" pointer-events="none">Son</text>
            <text x="200" y="300" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.7)" pointer-events="none">Beach & Resorts</text>

            <!-- Lien Chieu direction (north, faded) -->
            <text x="75" y="80" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)" opacity="0.5">↑ Lien Chieu</text>

            <!-- Dragon Bridge marker -->
            <line x1="120" y1="160" x2="170" y2="160" stroke="#FFD700" stroke-width="2" stroke-dasharray="4" opacity="0.6"/>
            <text x="145" y="155" text-anchor="middle" font-size="7" fill="#FFD700" opacity="0.8">Dragon Bridge 🐉</text>
          </svg>

          <div class="map-legend" id="map-legend"></div>
        </div>
      </div>

      <!-- Section 3: Area Cards -->
      <div class="area-cards" id="area-cards"></div>

    </div>

    <!-- Section 5: Senpai Stories -->
    <div class="senpai-stories-section">
      <div id="senpai-stories-header"></div>
      <div class="senpai-stories-grid" id="senpai-stories-grid"></div>
    </div>

  </div>

  <!-- Section 4: Detail Panel (overlay) -->
  <div class="area-detail-overlay" id="detail-overlay">
    <div class="area-detail-panel" id="detail-panel"></div>
  </div>

  <script type="module">
    import { renderTopNav } from './components/top-nav.js';
    import { renderSectionHeader } from './components/section-header.js';

    const res = await fetch('./data/demo-data.json');
    const data = await res.json();

    // TopNav
    renderTopNav(document.getElementById('nav-container'), { activePage: '' });

    // Personalization
    const workplace = data.areas.find(a => a.id === data.currentUser.workplaceArea);
    if (workplace) {
      document.getElementById('personalization').textContent =
        `📍 Showing commute times from your workplace: ${workplace.name}`;
    }

    // Color map for areas
    const areaColors = {
      'hai-chau': '#1B2A4A',
      'son-tra': '#2EC4B6',
      'ngu-hanh-son': '#FF6B4A',
      'east-han-river': '#F2994A',
    };

    // Section 2: Map legend
    const legend = document.getElementById('map-legend');
    data.areas.forEach(area => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.dataset.area = area.id;
      item.innerHTML = `<span class="legend-dot" style="background-color:${areaColors[area.id]}"></span>${area.name}`;
      item.addEventListener('click', () => highlightArea(area.id));
      legend.appendChild(item);
    });

    // Map zone click
    document.querySelectorAll('.map-zone').forEach(zone => {
      zone.addEventListener('click', () => highlightArea(zone.dataset.area, { scroll: true }));
    });

    function highlightArea(areaId, { scroll = false } = {}) {
      // Map zones
      document.querySelectorAll('.map-zone').forEach(z => z.classList.toggle('active', z.dataset.area === areaId));
      // Legend
      document.querySelectorAll('.legend-item').forEach(l => l.classList.toggle('active', l.dataset.area === areaId));
      // Cards
      document.querySelectorAll('.area-card').forEach(c => c.classList.toggle('highlighted', c.dataset.area === areaId));
      // Only scroll when explicitly requested (map/legend click)
      if (scroll) {
        const card = document.querySelector(`.area-card[data-area="${areaId}"]`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      console.log('[AreaGuide] Highlighted:', areaId);
    }

    // Section 3: Area Cards
    const cardsContainer = document.getElementById('area-cards');

    data.areas.forEach(area => {
      const card = document.createElement('div');
      card.className = 'area-card';
      card.dataset.area = area.id;

      const vndMin = (area.rentRange.min / 1000000).toFixed(0);
      const vndMax = (area.rentRange.max / 1000000).toFixed(0);

      card.innerHTML = `
        <div class="area-card-photo" style="background-color:${areaColors[area.id]}30;display:flex;align-items:center;justify-content:center;font-size:48px;">
          ${area.id === 'hai-chau' ? '🏙️' : area.id === 'son-tra' ? '🏖️' : area.id === 'ngu-hanh-son' ? '🌊' : '🏘️'}
        </div>
        <div class="area-card-body">
          <div class="area-card-name">${area.name} <span style="font-weight:400;font-size:14px;color:var(--color-text-secondary)">(${area.nameJp})</span></div>
          <div class="area-card-tagline">${area.tagline}</div>
          <div class="area-card-stats">
            <span class="area-stat"><span class="area-stat-icon">🚗</span> <span class="area-stat-value">${area.commuteFromHaiChau}</span> to workplace</span>
            <span class="area-stat"><span class="area-stat-icon">🏠</span> <span class="area-stat-value">${vndMin}-${vndMax}M VND</span>/mo <span style="color:var(--color-accent)">(¥${area.rentRangeJpy.min.toLocaleString()}-${area.rentRangeJpy.max.toLocaleString()})</span></span>
            <span class="area-stat"><span class="area-stat-icon">👥</span> <span class="area-stat-value">${area.senpaiCount} senpai</span> live here</span>
            <span class="area-stat"><span class="area-stat-icon">⭐</span> <span class="area-stat-value">${area.rating}</span></span>
          </div>
          <div class="area-card-highlights">
            ${area.highlights.map(h => `<span class="highlight-tag">${h}</span>`).join('')}
          </div>
          <button class="area-card-cta" data-area="${area.id}">Learn more →</button>
        </div>
      `;

      // Card click → highlight
      card.addEventListener('mouseenter', () => highlightArea(area.id));

      // CTA → open detail
      card.querySelector('.area-card-cta').addEventListener('click', (e) => {
        e.stopPropagation();
        openDetail(area);
      });

      cardsContainer.appendChild(card);
    });

    // Section 4: Detail Panel
    const overlay = document.getElementById('detail-overlay');
    const panel = document.getElementById('detail-panel');

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeDetail();
    });

    function closeDetail() {
      overlay.classList.remove('open');
    }

    function openDetail(area) {
      const senpai = data.senpai.find(s => s.area === area.id) || data.senpai[0];

      const formatPrice = (min, max) => `${(min/1000000).toFixed(0)}-${(max/1000000).toFixed(0)}M VND`;
      const formatJpy = (vnd) => `¥${Math.round(vnd/1000000*6000).toLocaleString()}`;

      panel.innerHTML = `
        <div class="detail-hero" style="background-color:${areaColors[area.id]}50;">
          <div class="detail-hero-overlay"></div>
          <button class="detail-close" onclick="document.getElementById('detail-overlay').classList.remove('open')">✕</button>
          <div class="detail-hero-name">${area.name} (${area.nameJp})</div>
        </div>
        <div class="detail-body">
          <div class="detail-section">
            <div class="detail-quote">"${senpai.quote}"</div>
            <div class="detail-quote-author">— ${senpai.name}, ${senpai.yearsInDanang} year${senpai.yearsInDanang > 1 ? 's' : ''} in Da Nang</div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">Pros & Cons</div>
            <div class="pros-cons">
              <ul class="pros-list">${area.pros.map(p => `<li>${p}</li>`).join('')}</ul>
              <ul class="cons-list">${area.cons.map(c => `<li>${c}</li>`).join('')}</ul>
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">Price Breakdown</div>
            <table class="price-table">
              <tr><th>Type</th><th>VND/month</th><th>JPY/month</th></tr>
              <tr><td>Studio</td><td>${formatPrice(area.priceBreakdown.studio.min, area.priceBreakdown.studio.max)}</td><td class="jpy">${formatJpy(area.priceBreakdown.studio.min)}-${formatJpy(area.priceBreakdown.studio.max)}</td></tr>
              <tr><td>1 Bedroom</td><td>${formatPrice(area.priceBreakdown.oneBr.min, area.priceBreakdown.oneBr.max)}</td><td class="jpy">${formatJpy(area.priceBreakdown.oneBr.min)}-${formatJpy(area.priceBreakdown.oneBr.max)}</td></tr>
              <tr><td>2 Bedroom</td><td>${formatPrice(area.priceBreakdown.twoBr.min, area.priceBreakdown.twoBr.max)}</td><td class="jpy">${formatJpy(area.priceBreakdown.twoBr.min)}-${formatJpy(area.priceBreakdown.twoBr.max)}</td></tr>
            </table>
          </div>

          <div class="detail-section">
            <div class="detail-section-title">Commute</div>
            <p style="font-size:14px;color:var(--color-text);">🚗 ${area.commuteFromHaiChau} to Hai Chau (workplace area)</p>
          </div>

          <button class="detail-cta-btn">Search apartments in ${area.name} →</button>
        </div>
      `;

      overlay.classList.add('open');
      console.log('[AreaGuide] Detail opened:', area.name);
    }

    // Section 5: Senpai Stories
    renderSectionHeader(document.getElementById('senpai-stories-header'), {
      title: '📖 Senpai Experiences',
      linkText: 'Read more →',
      linkHref: '#',
    });

    const storiesGrid = document.getElementById('senpai-stories-grid');
    data.senpai.slice(0, 3).forEach(senpai => {
      const area = data.areas.find(a => a.id === senpai.area);
      const card = document.createElement('div');
      card.className = 'senpai-story-card';
      card.innerHTML = `
        <div class="senpai-story-header">
          <div class="senpai-story-avatar"></div>
          <div>
            <div class="senpai-story-name">${senpai.name}</div>
            <div class="senpai-story-meta">${area ? area.name : ''} · ${senpai.yearsInDanang} year${senpai.yearsInDanang > 1 ? 's' : ''}</div>
          </div>
        </div>
        <div class="senpai-story-quote">"${senpai.quote}"</div>
      `;

    });
