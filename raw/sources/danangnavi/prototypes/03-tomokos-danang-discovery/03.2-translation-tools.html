<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation Tools — DaNangNavi</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================
       DESIGN TOKENS (CSS Custom Properties)
       ======================================== */
    :root {
      /* Brand Colors */
      --color-primary: #1B2A4A;
      --color-secondary: #FF6B4A;
      --color-accent: #2EC4B6;
      
      /* Surface Colors */
      --color-bg: #FAFAF8;
      --color-surface: #FFFFFF;
      --color-surface-hover: #F5F5F3;
      
      /* Text Colors */
      --color-text-primary: #0D1B2A;
      --color-text-secondary: #6B7280;
      --color-text-inverse: #FFFFFF;
      --color-text-link: #2EC4B6;
      
      /* Status Colors */
      --color-success: #27AE60;
      --color-warning: #F2994A;
      --color-error: #EB5757;
      --color-info: #2EC4B6;
      
      /* Translation Bubble Colors */
      --color-bubble-jp: #EEF0F6;
      --color-bubble-vn: #E8FAF8;
      
      /* Typography */
      --font-family-primary: 'Noto Sans JP', sans-serif;
      --font-family-ui: 'Inter', 'Noto Sans', sans-serif;
      
      /* Type Scale */
      --text-h1: 2rem;
      --text-h2: 1.5rem;
      --text-h3: 1.25rem;
      --text-body: 1rem;
      --text-caption: 0.875rem;
      --text-small: 0.75rem;
      
      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --space-2xl: 32px;
      --space-3xl: 48px;
      
      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-card-hover: 0 4px 16px rgba(0,0,0,0.12);
      --shadow-modal: 0 8px 32px rgba(0,0,0,0.2);
      --shadow-sticky: 0 2px 8px rgba(0,0,0,0.06);
      
      /* Animation */
      --duration-fast: 150ms;
      --duration-normal: 300ms;
      --duration-slow: 500ms;
      --easing-default: ease-in-out;
      
      /* Layout */
      --bottom-nav-height: 64px;
      --mic-button-size: 80px;
      --top-bar-height: 56px;
      --mode-selector-height: 48px;
    }
    
    /* ========================================
       CSS RESET & BASE STYLES
       ======================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    
    body {
      font-family: var(--font-family-primary);
      font-size: var(--text-body);
      line-height: 1.6;
      color: var(--color-text-primary);
      background-color: var(--color-bg);
      min-height: 100vh;
      overflow: hidden;
    }
    
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    
    a {
      color: var(--color-text-link);
      text-decoration: none;
      transition: color var(--duration-fast) var(--easing-default);
    }
    
    a:hover {
      color: var(--color-primary);
    }
    
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }
    
    /* ========================================
       PAGE CONTAINER
       ======================================== */
    .page-container {
      max-width: 640px;
      margin: 0 auto;
      background-color: var(--color-surface);
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    
    @media (min-width: 768px) {
      .page-container {
        max-width: 720px;
      }
    }
    
    @media (min-width: 1024px) {
      .page-container {
        max-width: 800px;
        box-shadow: var(--shadow-card);
      }
    }
    
    /* ========================================
       TOP APP BAR
       ======================================== */
    .top-bar {
      height: var(--top-bar-height);
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
      flex-shrink: 0;
    }
    
    .top-bar__back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: var(--color-text-inverse);
      border-radius: var(--radius-full);
      transition: background-color var(--duration-fast);
    }
    
    .top-bar__back:hover {
      background-color: rgba(255,255,255,0.1);
      color: var(--color-text-inverse);
    }
    
    .top-bar__title {
      font-size: var(--text-body);
      font-weight: 600;
    }
    
    .top-bar__action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: var(--color-text-inverse);
      border-radius: var(--radius-full);
      transition: background-color var(--duration-fast);
    }
    
    .top-bar__action:hover {
      background-color: rgba(255,255,255,0.1);
    }
    
    /* ========================================
       S1: MODE SELECTOR (SEGMENTED CONTROL)
       ======================================== */
    .mode-selector {
      height: var(--mode-selector-height);
      background-color: var(--color-surface);
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      padding: var(--space-sm) var(--space-lg);
      flex-shrink: 0;
    }
    
    .mode-selector__tabs {
      display: flex;
      width: 100%;
      background-color: var(--color-bg);
      border-radius: var(--radius-sm);
      padding: var(--space-xs);
    }
    
    .mode-selector__tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      font-size: var(--text-small);
      font-weight: 500;
      color: var(--color-primary);
      border-radius: var(--radius-sm);
      transition: all var(--duration-fast);
      white-space: nowrap;
    }
    
    .mode-selector__tab:hover {
      background-color: rgba(27, 42, 74, 0.05);
    }
    
    .mode-selector__tab--active {
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
    }
    
    .mode-selector__tab--active:hover {
      background-color: var(--color-primary);
    }
    
    .mode-selector__icon {
      font-size: var(--text-caption);
    }
    
    /* ========================================
       S2: VOICE TRANSLATION PANEL
       ======================================== */
    .translation-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #F9FAFB;
      overflow: hidden;
    }
    
    /* Language Pair Indicator */
    .language-pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      background-color: var(--color-surface);
      border-bottom: 1px solid #E5E7EB;
      flex-shrink: 0;
    }
    
    .language-pair__lang {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-primary);
    }
    
    .language-pair__flag {
      font-size: var(--text-body);
    }
    
    .language-pair__swap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background-color: var(--color-bg);
      color: var(--color-text-secondary);
      transition: all var(--duration-fast);
    }
    
    .language-pair__swap:hover {
      background-color: var(--color-accent);
      color: var(--color-text-inverse);
    }
    
    /* Conversation Area */
    .conversation-area {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }
    
    .conversation-pair {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    
    /* Japanese Input Bubble (Left) */
    .bubble {
      max-width: 85%;
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-lg);
      font-size: var(--text-body);
      line-height: 1.5;
      position: relative;
    }
    
    .bubble--jp {
      align-self: flex-start;
      background-color: var(--color-bubble-jp);
      border-bottom-left-radius: var(--space-xs);
    }
    
    .bubble__label {
      font-size: var(--text-small);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-xs);
    }
    
    .bubble__text {
      color: var(--color-text-primary);
    }
    
    .bubble__edit {
      position: absolute;
      top: var(--space-sm);
      right: var(--space-sm);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-secondary);
      opacity: 0;
      transition: opacity var(--duration-fast);
    }
    
    .bubble:hover .bubble__edit {
      opacity: 1;
    }
    
    /* Vietnamese Output Bubble (Right) */
    .bubble--vn {
      align-self: flex-end;
      background-color: var(--color-bubble-vn);
      border-bottom-right-radius: var(--space-xs);
    }
    
    .bubble--vn .bubble__text {
      font-weight: 500;
    }
    
    .bubble__pronunciation {
      font-size: var(--text-caption);
      color: var(--color-primary);
      background-color: #F0F4FF;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--space-xs);
      margin-top: var(--space-sm);
      display: inline-block;
    }
    
    .bubble__pronunciation::before {
      content: '📖 ';
    }
    
    .bubble__actions {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-top: var(--space-sm);
    }
    
    .bubble__play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background-color: var(--color-accent);
      color: var(--color-text-inverse);
      border-radius: var(--radius-full);
      transition: transform var(--duration-fast);
    }
    
    .bubble__play:hover {
      transform: scale(1.1);
    }
    
    .bubble__play--playing {
      animation: pulse-speaker 1s infinite;
    }
    
    @keyframes pulse-speaker {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .bubble__show-staff {
      font-size: var(--text-caption);
      color: var(--color-secondary);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    
    .bubble__show-staff:hover {
      color: var(--color-primary);
    }
    
    /* Empty State */
    .conversation-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      color: var(--color-text-secondary);
      text-align: center;
      padding: var(--space-xl);
    }
    
    .conversation-empty__icon {
      font-size: 48px;
      opacity: 0.6;
    }
    
    .conversation-empty__text {
      font-size: var(--text-caption);
    }
    
    /* ========================================
       S3: QUICK PHRASES
       ======================================== */
    .quick-phrases {
      padding: var(--space-md) var(--space-lg);
      background-color: var(--color-surface);
      border-top: 1px solid #E5E7EB;
      flex-shrink: 0;
    }
    
    .quick-phrases__label {
      font-size: var(--text-small);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }
    
    .quick-phrases__scroll {
      display: flex;
      gap: var(--space-sm);
      overflow-x: auto;
      padding-bottom: var(--space-sm);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    
    .quick-phrases__scroll::-webkit-scrollbar {
      display: none;
    }
    
    .phrase-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-surface);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-full);
      font-size: var(--text-caption);
      color: var(--color-primary);
      font-weight: 500;
      white-space: nowrap;
      transition: all var(--duration-fast);
      cursor: pointer;
    }
    
    .phrase-chip__icon {
      font-size: var(--text-body);
    }
    
    .phrase-chip:hover {
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
    }
    
    .phrase-chip--positive {
      border-color: var(--color-secondary);
      color: var(--color-secondary);
    }
    
    .phrase-chip--positive:hover {
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
    }
    
    .phrase-chip--more {
      border-style: dashed;
      border-color: var(--color-text-secondary);
      color: var(--color-text-secondary);
    }
    
    .phrase-chip--more:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background-color: transparent;
    }
    
    .phrase-chip--active {
      background-color: var(--color-secondary);
      border-color: var(--color-secondary);
      color: var(--color-text-inverse);
    }
    
    /* ========================================
       S2: MIC BUTTON AREA
       ======================================== */
    .mic-area {
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
      background-color: var(--color-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      flex-shrink: 0;
    }
    
    .mic-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xl);
    }
    
    /* Camera Button */
    .camera-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-surface);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-full);
      font-size: var(--text-caption);
      color: var(--color-primary);
      font-weight: 500;
      transition: all var(--duration-fast);
    }
    
    .camera-btn:hover {
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
    }
    
    /* Main Mic Button */
    .mic-btn {
      position: relative;
      width: var(--mic-button-size);
      height: var(--mic-button-size);
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-secondary), #e55a3a);
      color: var(--color-text-inverse);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 107, 74, 0.4);
      transition: transform var(--duration-fast), box-shadow var(--duration-fast);
    }
    
    .mic-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 107, 74, 0.5);
    }
    
    .mic-btn:active {
      transform: scale(0.95);
    }
    
    .mic-btn__icon {
      width: 32px;
      height: 32px;
    }
    
    /* Listening State */
    .mic-btn--listening {
      animation: pulse-mic 1s infinite;
    }
    
    .mic-btn--listening::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: var(--radius-full);
      border: 3px solid var(--color-secondary);
      animation: pulse-ring 1s infinite;
    }
    
    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    
    .mic-status {
      font-size: var(--text-caption);
      color: var(--color-text-secondary);
      height: 20px;
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }
    
    .mic-status--listening {
      color: var(--color-secondary);
      font-weight: 500;
    }
    
    .mic-status__dots {
      display: flex;
      gap: 2px;
    }
    
    .mic-status__dot {
      width: 4px;
      height: 4px;
      background-color: var(--color-secondary);
      border-radius: var(--radius-full);
      animation: dot-pulse 1.4s infinite;
    }
    
    .mic-status__dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .mic-status__dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes dot-pulse {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1.2); opacity: 1; }
    }
    
    /* Placeholder for other mic button */
    .mic-placeholder {
      width: 80px;
    }
    
    /* ========================================
       S4: VISUAL MENU HELPER (CAMERA OVERLAY)
       ======================================== */
    .camera-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--duration-normal), visibility var(--duration-normal);
    }
    
    .camera-overlay--active {
      opacity: 1;
      visibility: visible;
    }
    
    .camera-header {
      height: var(--top-bar-height);
      background-color: rgba(27, 42, 74, 0.9);
      color: var(--color-text-inverse);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
      flex-shrink: 0;
    }
    
    .camera-header__close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: var(--color-text-inverse);
    }
    
    .camera-header__title {
      font-size: var(--text-body);
      font-weight: 600;
    }
    
    .camera-viewfinder {
      flex: 1;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Simulated camera feed with menu image */
    .camera-feed {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1559925393-8be0ec4767c8?w=800&q=80');
      background-size: cover;
      background-position: center;
      filter: brightness(0.9);
    }
    
    /* Detection overlays */
    .detection-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    
    .detection-box {
      position: absolute;
      background-color: rgba(46, 196, 182, 0.3);
      border: 2px solid var(--color-accent);
      border-radius: var(--space-xs);
      pointer-events: auto;
      cursor: pointer;
    }
    
    .detection-label {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(27, 42, 74, 0.85);
      color: var(--color-text-inverse);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--space-xs);
      font-size: var(--text-small);
      font-weight: 500;
      white-space: nowrap;
    }
    
    .camera-instructions {
      position: absolute;
      top: var(--space-xl);
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.6);
      color: var(--color-text-inverse);
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--radius-full);
      font-size: var(--text-caption);
      text-align: center;
    }
    
    .camera-capture-btn {
      position: absolute;
      bottom: var(--space-2xl);
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 72px;
      border-radius: var(--radius-full);
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(255, 107, 74, 0.5);
      transition: transform var(--duration-fast);
    }
    
    .camera-capture-btn:hover {
      transform: translateX(-50%) scale(1.08);
    }
    
    /* ========================================
       SHOW TO STAFF (FULL SCREEN)
       ======================================== */
    .staff-display {
      position: fixed;
      inset: 0;
      background-color: var(--color-surface);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--duration-normal), visibility var(--duration-normal);
    }
    
    .staff-display--active {
      opacity: 1;
      visibility: visible;
    }
    
    .staff-display__back {
      position: absolute;
      top: var(--space-lg);
      left: var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-caption);
      color: var(--color-text-secondary);
      padding: var(--space-sm) var(--space-md);
    }
    
    .staff-display__text {
      font-size: 36px;
      font-weight: 700;
      color: var(--color-primary);
      text-align: center;
      padding: var(--space-xl);
      line-height: 1.4;
    }
    
    .staff-display__pronunciation {
      font-size: var(--text-h2);
      color: var(--color-text-secondary);
      font-weight: 400;
      margin-top: var(--space-lg);
    }
    
    /* ========================================
       TEXT INPUT PANEL
       ======================================== */
    .text-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      background-color: #F9FAFB;

            situation: "One thousand",
            situationJp: "数字",
            icon: "🔢",
            tip: "ベトナムドンは桁が大きいので覚えておくと便利"
          },
          {

            vn: "Mười nghìn", 
            pronunciation: "Muoi ngin", 
            katakana: "ムオイ ギン",
            situation: "Ten thousand",
            situationJp: "数字",
            icon: "🔢"
          },
          { 
            jp: "100,000", 
            vn: "Một trăm nghìn", 
            pronunciation: "Mot cham ngin", 
            katakana: "モット チャム ギン",
            situation: "One hundred thousand",
            situationJp: "数字",
            icon: "🔢",
            tip: "約600円相当（レートにより変動）"
          },
          { 
            jp: "1,000,000", 
            vn: "Một triệu", 
            pronunciation: "Mot chiew", 
            katakana: "モット チエウ",
            situation: "One million",
            situationJp: "数字",
            icon: "🔢",
            tip: "約6,000円相当（レートにより変動）"
          }
        ]
      },
      sampleTranslations: [
        { jp: "辛くしないでください", vn: "Làm ơn đừng cho cay", pronunciation: "ラム ウン ドゥン チョー カイ" },
        { jp: "これは何ですか？", vn: "Cái này là gì?", pronunciation: "カイ ナイ ラー ジー?" },
        { jp: "お会計お願いします", vn: "Tính tiền ạ", pronunciation: "ティン ティエン アー" },
        { jp: "おすすめは何ですか？", vn: "Món nào ngon?", pronunciation: "モン ナオ ゴン?" },
        { jp: "これをください", vn: "Cho tôi cái này", pronunciation: "チョー トイ カイ ナイ" }
      ]
    };
    
    // State
    let currentMode = 'voice';
    let isListening = false;
    let conversationHistory = [];
    let isLangSwapped = false;
    let currentCategory = 'ordering';
    
    // DOM Elements
    const modeTabs = document.querySelectorAll('.mode-selector__tab');
    const voicePanel = document.getElementById('voice-panel');
    const textPanel = document.getElementById('text-panel');
    const phrasebookPanel = document.getElementById('phrasebook-panel');
    const micBtn = document.getElementById('mic-btn');
    const micStatus = document.getElementById('mic-status');
    const conversationArea = document.getElementById('conversation-area');
    const conversationEmpty = document.getElementById('conversation-empty');
    const quickPhrasesContainer = document.getElementById('quick-phrases');
    const swapLangBtn = document.getElementById('swap-lang-btn');
    const sourceLang = document.getElementById('source-lang');
    const targetLang = document.getElementById('target-lang');
    const cameraBtn = document.getElementById('camera-btn');
    const cameraOverlay = document.getElementById('camera-overlay');
    const cameraCloseBtn = document.getElementById('camera-close-btn');
    const cameraCaptureBtn = document.getElementById('camera-capture-btn');
    const staffDisplay = document.getElementById('staff-display');
    const staffBackBtn = document.getElementById('staff-back-btn');
    const staffText = document.getElementById('staff-text');
    const staffPronunciation = document.getElementById('staff-pronunciation');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const textInput = document.getElementById('text-input');
    const textTranslateBtn = document.getElementById('text-translate-btn');
    const textOutputBox = document.getElementById('text-output-box');
    const textOutput = document.getElementById('text-output');
    const textPronunciationEl = document.getElementById('text-pronunciation');
    const phrasebookCategories = document.getElementById('phrasebook-categories');
    const phrasebookList = document.getElementById('phrasebook-list');
    
    // Render quick phrases with icons
    function renderQuickPhrases() {
      quickPhrasesContainer.innerHTML = demoData.quickPhrases.map((phrase, i) => `
        <button class="phrase-chip ${phrase.positive ? 'phrase-chip--positive' : ''}" data-index="${i}" title="${phrase.situation}">
          <span class="phrase-chip__icon">${phrase.icon || ''}</span>
          ${phrase.jp}
        </button>
      `).join('') + `
        <button class="phrase-chip phrase-chip--more" id="more-phrases-btn">
          もっと見る (+25)
        </button>
      `;
      
      // Add click handlers
      document.querySelectorAll('.phrase-chip[data-index]').forEach(chip => {
        chip.addEventListener('click', () => {
          const index = parseInt(chip.dataset.index);
          const phrase = demoData.quickPhrases[index];
          
          // Visual feedback
          chip.classList.add('phrase-chip--active');
          setTimeout(() => chip.classList.remove('phrase-chip--active'), 300);
          
          // Add to conversation with katakana pronunciation
          addToConversation(phrase.jp, phrase.vn, phrase.katakana || phrase.pronunciation);
        });
      });
      
      // More phrases button
      document.getElementById('more-phrases-btn').addEventListener('click', () => {
        switchMode('phrasebook');
      });
    }
    
    // Render phrasebook categories
    function renderPhrasebookCategories() {
      phrasebookCategories.innerHTML = demoData.phrasebookCategories.map(cat => `
        <button class="category-chip ${cat.id === currentCategory ? 'category-chip--active' : ''}" data-category="${cat.id}" title="${cat.description}">
          ${cat.name}
          <span class="category-chip__count">(${cat.count})</span>
        </button>
      `).join('');
      
      // Add click handlers
      document.querySelectorAll('.category-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          currentCategory = chip.dataset.category;
          renderPhrasebookCategories();
          renderPhrasebookList();
        });
      });
    }
    
    // Render phrasebook list with enhanced design
    function renderPhrasebookList() {
      const phrases = demoData.phrases[currentCategory] || [];
      const categoryInfo = demoData.phrasebookCategories.find(c => c.id === currentCategory);
      
      let headerHtml = '';
      if (categoryInfo) {
        headerHtml = `
          <div class="phrasebook-header">
            <h3 class="phrasebook-header__title">${categoryInfo.name} <span class="phrasebook-header__count">${phrases.length}フレーズ</span></h3>
            <p class="phrasebook-header__desc">${categoryInfo.description}</p>
          </div>
        `;
      }
      
      phrasebookList.innerHTML = headerHtml + phrases.map((phrase, i) => `
        <div class="phrase-item" data-category="${currentCategory}" data-index="${i}">
          <div class="phrase-item__icon">${phrase.icon || '💬'}</div>
          <div class="phrase-item__content">
            <p class="phrase-item__situation">
              ${phrase.situationJp || phrase.situation}
              ${phrase.essential ? '<span class="phrase-item__situation-badge phrase-item__situation-badge--essential">必須</span>' : ''}
            </p>
            <p class="phrase-item__jp">${phrase.jp}</p>
            <p class="phrase-item__vn">${phrase.vn}</p>
            <p class="phrase-item__katakana">📖 ${phrase.katakana}</p>
            <p class="phrase-item__pronunciation">${phrase.pronunciation}</p>
            ${phrase.tip ? `
              <div class="phrase-item__tip">
                <span class="phrase-item__tip-icon">${phrase.tipIcon || '💡'}</span>
                <span>${phrase.tip}</span>
              </div>
            ` : ''}
            <div class="phrase-item__actions">
              <button class="phrase-item__play">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                音声再生
              </button>
              <button class="phrase-item__use">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="9 11 12 14 22 4"></polyline>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                使う
              </button>
            </div>
          </div>
        </div>
      `).join('');
      
      // Add click handlers for play buttons
      document.querySelectorAll('.phrase-item__play').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          // Play audio simulation
          btn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            再生中...
          `;
          setTimeout(() => {
            btn.innerHTML = `
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              音声再生
            `;
          }, 1500);
        });
      });
      
      // Add click handlers for use buttons
      document.querySelectorAll('.phrase-item__use').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const item = btn.closest('.phrase-item');
          const idx = parseInt(item.dataset.index);
          const cat = item.dataset.category;
          const phrase = demoData.phrases[cat][idx];
          
          addToConversation(phrase.jp, phrase.vn, phrase.katakana || phrase.pronunciation);
          switchMode('voice');
        });
      });
    }
    
    // Add to conversation
    function addToConversation(jp, vn, pronunciation) {
      conversationEmpty.style.display = 'none';
      
      const pair = document.createElement('div');
      pair.className = 'conversation-pair';
      pair.innerHTML = `
        <div class="bubble bubble--jp">
          <span class="bubble__label">🇯🇵 日本語</span>
          <p class="bubble__text">${jp}</p>
          <button class="bubble__edit" aria-label="Edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
        </div>
        <div class="bubble bubble--vn">
          <span class="bubble__label">🇻🇳 ベトナム語</span>
          <p class="bubble__text">${vn}</p>
          <p class="bubble__pronunciation">${pronunciation}</p>
          <div class="bubble__actions">
            <button class="bubble__play" aria-label="Play audio">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
            </button>
            <button class="bubble__show-staff" data-vn="${vn}" data-pronunciation="${pronunciation}">
              スタッフに見せる
            </button>
          </div>
        </div>
      `;
      
      conversationArea.appendChild(pair);
      
      // Scroll to bottom
      conversationArea.scrollTop = conversationArea.scrollHeight;
      
      // Add event listeners
      pair.querySelector('.bubble__play').addEventListener('click', function() {
        this.classList.add('bubble__play--playing');
        setTimeout(() => this.classList.remove('bubble__play--playing'), 1500);
      });
      
      pair.querySelector('.bubble__show-staff').addEventListener('click', function() {
        showStaffDisplay(this.dataset.vn, this.dataset.pronunciation);
      });
      
      // Store in history
      conversationHistory.push({ jp, vn, pronunciation });
    }
    
    // Show staff display
    function showStaffDisplay(vn, pronunciation) {
      staffText.innerHTML = `${vn}<span class="staff-display__pronunciation">${pronunciation}</span>`;
      staffDisplay.classList.add('staff-display--active');
    }
    
    // Switch mode
    function switchMode(mode) {
      currentMode = mode;
      
      modeTabs.forEach(tab => {
        tab.classList.toggle('mode-selector__tab--active', tab.dataset.mode === mode);
      });
      
      voicePanel.style.display = mode === 'voice' ? 'flex' : 'none';
      textPanel.classList.toggle('text-panel--active', mode === 'text');
      phrasebookPanel.classList.toggle('phrasebook-panel--active', mode === 'phrasebook');
    }
    
    // Toggle listening
    function toggleListening() {
      isListening = !isListening;
      
      if (isListening) {
        micBtn.classList.add('mic-btn--listening');
        micStatus.innerHTML = `
          <span class="mic-status--listening">聞いています...</span>
          <span class="mic-status__dots">
            <span class="mic-status__dot"></span>
            <span class="mic-status__dot"></span>
            <span class="mic-status__dot"></span>
          </span>
        `;
        
        // Simulate speech recognition after 2 seconds
        setTimeout(() => {
          if (isListening) {
            toggleListening();
            // Add random sample translation
            const sample = demoData.sampleTranslations[Math.floor(Math.random() * demoData.sampleTranslations.length)];
            addToConversation(sample.jp, sample.vn, sample.pronunciation);
          }
        }, 2000);
      } else {
        micBtn.classList.remove('mic-btn--listening');
        micStatus.textContent = 'タップして話す';
      }
    }
    
    // Swap languages
    function swapLanguages() {
      isLangSwapped = !isLangSwapped;
      
      const swap = swapLangBtn.querySelector('svg');
      swap.style.transform = `rotate(${isLangSwapped ? 180 : 0}deg)`;
      swap.style.transition = 'transform 0.2s';
      
      if (isLangSwapped) {
        sourceLang.textContent = 'ベトナム語';
        targetLang.textContent = '日本語';
      } else {
        sourceLang.textContent = '日本語';
        targetLang.textContent = 'ベトナム語';
      }
    }
    
    // Clear history
    function clearHistory() {
      conversationHistory = [];
      conversationArea.querySelectorAll('.conversation-pair').forEach(el => el.remove());
      conversationEmpty.style.display = 'flex';
    }
    
    // Text translation
    function translateText() {
      const input = textInput.value.trim();
      if (!input) return;
      
      // Find matching phrase or use default
      const match = Object.values(demoData.phrases).flat().find(p => p.jp === input);
      
      if (match) {
        textOutput.textContent = match.vn;
        textPronunciationEl.textContent = match.pronunciation;
      } else {
        // Simulate translation
        textOutput.textContent = 'Xin chào';
        textPronunciationEl.textContent = 'Sin chao';
      }
      
      textOutputBox.style.display = 'block';
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      renderQuickPhrases();
      renderPhrasebookCategories();
      renderPhrasebookList();
      
      // Mode tabs
      modeTabs.forEach(tab => {
        tab.addEventListener('click', () => switchMode(tab.dataset.mode));
      });
      
      // Mic button
      micBtn.addEventListener('click', toggleListening);
      
      // Swap languages
      swapLangBtn.addEventListener('click', swapLanguages);
      
      // Clear history
      clearHistoryBtn.addEventListener('click', clearHistory);
      
      // Camera
      cameraBtn.addEventListener('click', () => {
        cameraOverlay.classList.add('camera-overlay--active');
      });
      
      cameraCloseBtn.addEventListener('click', () => {
        cameraOverlay.classList.remove('camera-overlay--active');
      });
      
      cameraCaptureBtn.addEventListener('click', () => {
        // Simulate capture
        alert('Photo captured! Translation saved to history.');
        cameraOverlay.classList.remove('camera-overlay--active');
      });
      
      // Staff display back
      staffBackBtn.addEventListener('click', () => {
        staffDisplay.classList.remove('staff-display--active');
      });
      
      // Text translation
      textTranslateBtn.addEventListener('click', translateText);
      
      textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          translateText();
        }
      });
      
      console.log('[DaNangNavi] Page 03.2 Translation Tools loaded');
    });
  </script>
