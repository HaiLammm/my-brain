<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deals & Coupons — DaNangNavi</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================
       DESIGN TOKENS (CSS Custom Properties)
       ======================================== */
    :root {
      /* Brand Colors */
      --color-primary: #1B2A4A;
      --color-secondary: #FF6B4A;
      --color-accent: #2EC4B6;
      
      /* Surface Colors */
      --color-bg: #F9FAFB;
      --color-surface: #FFFFFF;
      --color-surface-hover: #F5F5F3;
      
      /* Text Colors */
      --color-text-primary: #0D1B2A;
      --color-text-secondary: #6B7280;
      --color-text-inverse: #FFFFFF;
      --color-text-link: #2EC4B6;
      
      /* Status Colors */
      --color-success: #27AE60;
      --color-warning: #F2994A;
      --color-error: #EF4444;
      --color-info: #2EC4B6;
      
      /* Typography */
      --font-family-primary: 'Noto Sans JP', sans-serif;
      --font-family-ui: 'Inter', 'Noto Sans', sans-serif;
      --font-mono: 'Courier New', monospace;
      
      /* Type Scale */
      --text-h1: 2rem;
      --text-h2: 1.5rem;
      --text-h3: 1.25rem;
      --text-body: 1rem;
      --text-caption: 0.875rem;
      --text-small: 0.75rem;
      
      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --space-2xl: 32px;
      --space-3xl: 48px;
      
      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-card-hover: 0 4px 16px rgba(0,0,0,0.12);
      --shadow-modal: 0 8px 32px rgba(0,0,0,0.2);
      --shadow-sticky: 0 2px 8px rgba(0,0,0,0.06);
      
      /* Animation */
      --duration-fast: 150ms;
      --duration-normal: 300ms;
      --duration-slow: 500ms;
      --easing-default: ease-in-out;
      
      /* Layout */
      --bottom-nav-height: 64px;
      --header-height: 56px;
    }
    
    /* ========================================
       CSS RESET & BASE STYLES
       ======================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    
    body {
      font-family: var(--font-family-primary);
      font-size: var(--text-body);
      line-height: 1.6;
      color: var(--color-text-primary);
      background-color: var(--color-bg);
      min-height: 100vh;
      padding-bottom: calc(var(--bottom-nav-height) + var(--space-xl));
    }
    
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    
    a {
      color: var(--color-text-link);
      text-decoration: none;
      transition: color var(--duration-fast) var(--easing-default);
    }
    
    a:hover {
      color: var(--color-primary);
    }
    
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }
    
    /* ========================================
       PAGE CONTAINER
       ======================================== */
    .page-container {
      max-width: 640px;
      margin: 0 auto;
      background-color: var(--color-bg);
      min-height: 100vh;
      position: relative;
    }
    
    @media (min-width: 768px) {
      .page-container {
        max-width: 720px;
      }
    }
    
    @media (min-width: 1024px) {
      .page-container {
        max-width: 1024px;
      }
    }
    
    /* ========================================
       S1: DEALS HEADER
       ======================================== */
    .deals-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--color-surface);
      padding: var(--space-lg);
      border-bottom: 2px solid;
      border-image: linear-gradient(90deg, var(--color-secondary), var(--color-accent)) 1;
    }
    
    .deals-header__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--space-md);
    }
    
    .deals-header__title {
      font-size: var(--text-h2);
      font-weight: 700;
      color: var(--color-primary);
    }
    
    .deals-header__subtitle {
      font-size: var(--text-caption);
      color: var(--color-text-secondary);
      margin-top: var(--space-xs);
    }
    
    .deals-header__wallet-btn {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-bg);
      border-radius: var(--radius-full);
      font-size: var(--text-small);
      font-weight: 500;
      color: var(--color-primary);
      transition: background-color var(--duration-fast);
    }
    
    .deals-header__wallet-btn:hover {
      background-color: var(--color-surface-hover);
    }
    
    .deals-header__wallet-badge {
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
      font-size: var(--text-small);
      font-weight: 600;
      padding: 2px 6px;
      border-radius: var(--radius-full);
    }
    
    .deals-header__filters {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }
    
    .filter-chips {
      display: flex;
      gap: var(--space-sm);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
    }
    
    .filter-chips::-webkit-scrollbar {
      display: none;
    }
    
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-surface);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-full);
      font-size: var(--text-small);
      font-weight: 500;
      color: var(--color-primary);
      white-space: nowrap;
      transition: all var(--duration-fast);
      cursor: pointer;
    }
    
    .filter-chip:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    
    .filter-chip--active {
      background-color: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-text-inverse);
    }
    
    .filter-chip--active:hover {
      background-color: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-text-inverse);
    }
    
    .sort-dropdown {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: var(--text-small);
      color: var(--color-primary);
      cursor: pointer;
      white-space: nowrap;
    }
    
    .sort-dropdown:hover {
      color: var(--color-accent);
    }
    
    /* ========================================
       S5: SAVINGS SUMMARY
       ======================================== */
    .savings-card {
      margin: var(--space-md) var(--space-lg);
      padding: var(--space-md) var(--space-lg);
      background: linear-gradient(135deg, var(--color-primary) 0%, #1A6B62 100%);
      border-radius: var(--radius-md);
      color: var(--color-text-inverse);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .savings-card__period {
      position: absolute;
      top: var(--space-sm);
      right: var(--space-sm);
      font-size: var(--text-small);
      opacity: 0.6;
    }
    
    .savings-card__label {
      font-size: var(--text-small);
      opacity: 0.8;
      margin-bottom: 2px;
    }
    
    .savings-card__amount {
      font-size: var(--text-h2);
      font-weight: 700;
      margin-bottom: 2px;
    }
    
    .savings-card__amount span {
      font-size: var(--text-h3);
    }
    
    .savings-card__vnd {
      font-size: var(--text-small);
      opacity: 0.7;
      margin-bottom: var(--space-sm);
    }
    
    .savings-card__count {
      font-size: var(--text-small);
      margin-bottom: var(--space-sm);
    }
    
    .savings-card__share {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-md);
      background-color: transparent;
      border: 1px solid var(--color-text-inverse);
      border-radius: var(--radius-full);
      font-size: var(--text-small);
      color: var(--color-text-inverse);
      transition: all var(--duration-fast);
    }
    
    .savings-card__share:hover {
      background-color: rgba(255,255,255,0.1);
    }
    
    /* Confetti Animation */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confetti-fall 2s ease-out forwards;
      pointer-events: none;
    }
    
    @keyframes confetti-fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(200px) rotate(720deg);
        opacity: 0;
      }
    }
    
    /* ========================================
       S2: COUPON CARDS
       ======================================== */
    .coupon-list {
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    
    .coupon-card {
      display: flex;
      gap: var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: var(--space-md);
      position: relative;
      transition: box-shadow var(--duration-fast);
    }
    
    .coupon-card:hover {
      box-shadow: var(--shadow-card-hover);
    }
    
    .coupon-card--used {
      opacity: 0.6;
    }
    
    .coupon-card__image {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }
    
    .coupon-card__content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    
    .coupon-card__header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-sm);
      margin-bottom: var(--space-xs);
    }
    
    .coupon-card__title {
      font-size: var(--text-body);
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .coupon-card__save {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-secondary);
      transition: all var(--duration-fast);
    }
    
    .coupon-card__save:hover {
      color: var(--color-secondary);
      transform: scale(1.1);
    }
    
    .coupon-card__save--saved {
      color: var(--color-secondary);
    }
    
    .coupon-card__business {
      font-size: var(--text-small);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-sm);
    }
    
    .coupon-card__meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }
    
    .coupon-card__savings {
      display: inline-flex;
      align-items: center;
      padding: var(--space-xs) var(--space-sm);
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
      font-size: var(--text-small);
      font-weight: 600;
      border-radius: var(--radius-full);
    }
    
    .coupon-card__distance {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: var(--text-small);
      color: var(--color-accent);
    }
    
    .coupon-card__expiry {
      font-size: var(--text-small);
      color: var(--color-text-secondary);
    }
    
    .coupon-card__expiry--urgent {
      color: var(--color-error);
      font-weight: 500;
    }
    
    .coupon-card__cta {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
      font-size: var(--text-caption);
      font-weight: 600;
      border-radius: var(--radius-sm);
      text-align: center;
      transition: opacity var(--duration-fast);
    }
    
    .coupon-card__cta:hover {
      opacity: 0.9;
      color: var(--color-text-inverse);
    }
    
    /* Used stamp overlay */
    .coupon-card__stamp {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      font-size: var(--text-h3);
      font-weight: 700;
      color: var(--color-text-secondary);
      border: 3px solid var(--color-text-secondary);
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--radius-sm);
      opacity: 0.8;
      pointer-events: none;
    }
    
    /* ========================================
       S3: COUPON DETAIL MODAL
       ======================================== */
    .coupon-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--duration-normal), visibility var(--duration-normal);
    }
    
    .coupon-modal--active {
      opacity: 1;
      visibility: visible;
    }
    
    .coupon-modal__sheet {
      background-color: var(--color-surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform var(--duration-normal) ease-out;
    }
    
    .coupon-modal--active .coupon-modal__sheet {
      transform: translateY(0);
    }
    
    .coupon-modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-lg);
      border-bottom: 1px solid #E5E7EB;
      position: sticky;
      top: 0;
      background-color: var(--color-surface);
    }
    
    .coupon-modal__header-bar {
      position: absolute;
      top: var(--space-sm);
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background-color: #D1D5DB;
      border-radius: var(--radius-full);
    }
    
    .coupon-modal__title {
      font-size: var(--text-body);
      font-weight: 700;
      color: var(--color-primary);
    }
    
    .coupon-modal__close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-secondary);
      transition: color var(--duration-fast);
    }
    
    .coupon-modal__close:hover {
      color: var(--color-text-primary);
    }
    
    .coupon-modal__body {
      padding: var(--space-xl);
      text-align: center;
    }
    
    .coupon-modal__business {
      margin-bottom: var(--space-lg);
    }
    
    .coupon-modal__logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      margin: 0 auto var(--space-sm);
    }
    
    .coupon-modal__business-name {
      font-size: var(--text-h3);
      font-weight: 700;
      color: var(--color-primary);
    }
    
    .coupon-modal__qr {
      background-color: var(--color-surface);
      padding: var(--space-lg);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-lg);
      display: inline-block;
    }
    
    .coupon-modal__qr-code {
      width: 180px;
      height: 180px;
      background: repeating-linear-gradient(
        0deg,
        var(--color-primary) 0px,
        var(--color-primary) 8px,
        var(--color-surface) 8px,
        var(--color-surface) 16px
      ),
      repeating-linear-gradient(
        90deg,
        var(--color-primary) 0px,
        var(--color-primary) 8px,
        var(--color-surface) 8px,
        var(--color-surface) 16px
      );
      background-blend-mode: difference;
      margin: 0 auto var(--space-md);
      border-radius: var(--space-xs);
      position: relative;
    }
    
    .coupon-modal__qr-code::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background-color: var(--color-surface);
      border-radius: var(--space-xs);
    }
    
    .coupon-modal__code {
      font-family: var(--font-mono);
      font-size: var(--text-body);
      color: var(--color-text-secondary);
      cursor: pointer;
    }
    
    .coupon-modal__code:hover {
      color: var(--color-accent);
    }
    
    .coupon-modal__instruction {
      padding: var(--space-md);
      border: 2px dashed var(--color-secondary);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-lg);
    }
    
    .coupon-modal__instruction-text {
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--color-secondary);
    }
    
    .coupon-modal__deal {
      font-size: var(--text-caption);
      color: var(--color-primary);
      margin-bottom: var(--space-md);
    }
    
    .coupon-modal__terms {
      text-align: left;
      margin-bottom: var(--space-lg);
    }
    
    .coupon-modal__terms-toggle {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: var(--text-small);
      color: var(--color-text-secondary);
      cursor: pointer;
    }
    
    .coupon-modal__terms-content {
      font-size: var(--text-small);
      color: var(--color-text-secondary);
      margin-top: var(--space-sm);
      padding-left: var(--space-lg);
      display: none;
    }
    
    .coupon-modal__terms-content--visible {
      display: block;
    }
    
    .coupon-modal__validity {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      font-size: var(--text-small);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-lg);
    }
    
    .coupon-modal__redeem {
      width: 100%;
      padding: var(--space-md) var(--space-xl);
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
      font-size: var(--text-body);
      font-weight: 700;
      border-radius: var(--radius-full);
      transition: all var(--duration-fast);
    }
    
    .coupon-modal__redeem:hover {
      opacity: 0.9;
    }
    
    .coupon-modal__redeem--used {
      background-color: var(--color-success);
      cursor: default;
    }
    
    .coupon-modal__redeem--used:hover {
      opacity: 1;
    }
    
    /* ========================================
       S4: MY COUPONS (WALLET VIEW)
       ======================================== */
    .wallet-view {
      display: none;
    }
    
    .wallet-view--active {
      display: block;
    }
    
    .wallet-tabs {
      display: flex;
      padding: 0 var(--space-lg);
      border-bottom: 1px solid #E5E7EB;
      background-color: var(--color-surface);
    }
    
    .wallet-tab {
      flex: 1;
      padding: var(--space-md);
      text-align: center;
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-text-secondary);
      border-bottom: 3px solid transparent;
      transition: all var(--duration-fast);
    }
    
    .wallet-tab:hover {
      color: var(--color-primary);
    }
    
    .wallet-tab--active {
      color: var(--color-primary);
      font-weight: 600;
      border-bottom-color: var(--color-primary);
    }
    
    .wallet-tab__badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
      font-size: var(--text-small);
      font-weight: 600;
      border-radius: var(--radius-full);
      margin-left: var(--space-xs);
    }
    
    .wallet-tab--active .wallet-tab__badge {
      background-color: var(--color-primary);
    }
    
    .wallet-empty {
      text-align: center;
      padding: var(--space-3xl) var(--space-xl);
    }
    
    .wallet-empty__icon {
      font-size: 64px;
      margin-bottom: var(--space-lg);
      opacity: 0.6;
    }
    
    .wallet-empty__text {
      font-size: var(--text-body);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-lg);
    }
    
    .wallet-empty__cta {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      background-color: var(--color-secondary);
      color: var(--color-text-inverse);
      font-size: var(--text-caption);
      font-weight: 600;
      border-radius: var(--radius-full);
    }
    
    .wallet-empty__cta:hover {
      opacity: 0.9;
      color: var(--color-text-inverse);
    }
    
    /* ========================================
       CONFIRMATION MODAL
       ======================================== */
    .confirm-modal {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--duration-fast), visibility var(--duration-fast);
    }
    
    .confirm-modal--active {
      opacity: 1;

    // Format currency
    function formatVND(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + '₫';
    }
    
    function formatJPY(amount) {
      return '¥' + new Intl.NumberFormat('ja-JP').format(amount);
    }
    
    // Show toast
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('toast--visible');
      setTimeout(() => toast.classList.remove('toast--visible'), 2500);
    }
    
    // Create confetti
    function createConfetti() {
      const colors = ['#FF6B4A', '#2EC4B6', '#FFFFFF', '#1B2A4A'];
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.top = '-10px';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        savingsCard.appendChild(confetti);
        setTimeout(() => confetti.remove(), 2500);
      }
    }
    
    // Update savings display
    function updateSavings() {
      const usedCoupons = coupons.filter(c => c.used);
      totalSavings = usedCoupons.reduce((sum, c) => sum + c.savingsJpy, 0);
      usedCount = usedCoupons.length;
      
      const totalVnd = usedCoupons.reduce((sum, c) => sum + c.savingsVnd, 0);
      
      // Show/hide savings card based on whether user has savings
      const savingsCardEl = document.getElementById('savings-card');
      if (usedCount > 0) {
        savingsCardEl.classList.add('savings-card--has-savings');
      } else {
        savingsCardEl.classList.remove('savings-card--has-savings');
      }
      
      // Animate count up
      const amountEl = document.getElementById('savings-amount');
      const vndEl = document.getElementById('savings-vnd');
      const countEl = document.getElementById('used-count');
      
      let currentAmount = 0;
      const step = Math.ceil(totalSavings / 20);
      const interval = setInterval(() => {
        currentAmount = Math.min(currentAmount + step, totalSavings);
        amountEl.textContent = new Intl.NumberFormat('ja-JP').format(currentAmount);
        if (currentAmount >= totalSavings) clearInterval(interval);
      }, 50);
      
      vndEl.textContent = `(約${formatVND(totalVnd)})`;
      countEl.textContent = usedCount;
      
      document.getElementById('used-badge').textContent = usedCount;
    }
    
    // Update wallet counts
    function updateWalletCounts() {
      const savedUnused = coupons.filter(c => c.saved && !c.used);
      const savedUsed = coupons.filter(c => c.saved && c.used);
      
      document.getElementById('saved-count').textContent = savedUnused.length;
      document.getElementById('unused-badge').textContent = savedUnused.length;
      document.getElementById('used-badge').textContent = savedUsed.length;
    }

      } else if (filter !== 'all') {
        filtered = filtered.filter(c => c.category === filter);
      }
      
      couponList.innerHTML = filtered.map(renderCouponCard).join('');
      document.getElementById('coupon-count').textContent = `${filtered.length}件のクーポンが利用可能`;
      
      // Add event listeners
      document.querySelectorAll('.coupon-card__save').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const coupon = coupons.find(c => c.id === id);
          coupon.saved = !coupon.saved;
          btn.classList.toggle('coupon-card__save--saved');
          btn.querySelector('svg').setAttribute('fill', coupon.saved ? 'currentColor' : 'none');

        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          openCouponModal(id);
        });
      });

            <div class="wallet-empty__icon">🛍️</div>
            <p class="wallet-empty__text">クーポンを探しましょう！</p>
            <button class="wallet-empty__cta" id="browse-deals-btn">お得情報を見る</button>
          </div>`;
      
      document.getElementById('wallet-used').innerHTML = savedUsed.length > 0
        ? savedUsed.map(renderCouponCard).join('')
        : `<div class="wallet-empty">
            <div class="wallet-empty__icon">🎫</div>
            <p class="wallet-empty__text">まだクーポンを使っていません</p>
          </div>`;
      
      document.getElementById('wallet-unused').style.display = tab === 'unused' ? 'flex' : 'none';
      document.getElementById('wallet-used').style.display = tab === 'used' ? 'block' : 'none';
      
      // Re-add event listeners
      document.querySelectorAll('.coupon-card__cta').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          openCouponModal(id);
        });
      });
      
      const browseBtn = document.getElementById('browse-deals-btn');
      if (browseBtn) {
        browseBtn.addEventListener('click', () => switchView('browse'));
      }
    }
    
    // Open coupon modal
    function openCouponModal(id) {
      selectedCoupon = coupons.find(c => c.id === id);
      if (!selectedCoupon) return;
      
      document.getElementById('modal-logo').src = selectedCoupon.photo;
      document.getElementById('modal-business').textContent = selectedCoupon.businessJp;
      document.getElementById('modal-code').textContent = selectedCoupon.code;
      document.getElementById('modal-deal').textContent = selectedCoupon.conditionsJp;
      document.getElementById('terms-content').textContent = selectedCoupon.conditionsJp;
      document.getElementById('modal-dates').textContent = selectedCoupon.validDates;
      
      const redeemBtn = document.getElementById('redeem-btn');
      if (selectedCoupon.used) {
        redeemBtn.textContent = '✓ 使用済み';
        redeemBtn.classList.add('coupon-modal__redeem--used');
      } else {
        redeemBtn.textContent = 'クーポンを使用済みにする';
        redeemBtn.classList.remove('coupon-modal__redeem--used');
      }
      
      couponModal.classList.add('coupon-modal--active');
    }
    
    // Close coupon modal
    function closeCouponModal() {
      couponModal.classList.remove('coupon-modal--active');
      selectedCoupon = null;
    }
    
    // Redeem coupon
    function redeemCoupon() {
      if (!selectedCoupon || selectedCoupon.used) return;
      
      confirmModal.classList.add('confirm-modal--active');
    }
    
    function confirmRedeem() {
      if (!selectedCoupon) return;
      
      selectedCoupon.used = true;
      selectedCoupon.saved = true;
      
      confirmModal.classList.remove('confirm-modal--active');
      
      const redeemBtn = document.getElementById('redeem-btn');
      redeemBtn.textContent = '✓ 使用済み';
      redeemBtn.classList.add('coupon-modal__redeem--used');
      
      // Update savings and trigger confetti
      updateSavings();
      createConfetti();
      
      showToast(`${formatJPY(selectedCoupon.savingsJpy)}お得になりました！`);
      
      // Update lists
      renderCoupons(currentFilter);
      renderWallet(currentWalletTab);
      updateWalletCounts();
    }
    
    // Switch view
    function switchView(view) {
      currentView = view;
      
      if (view === 'browse') {
        mainContent.style.display = 'block';
        walletView.classList.remove('wallet-view--active');
      } else {
        mainContent.style.display = 'none';
        walletView.classList.add('wallet-view--active');
        renderWallet(currentWalletTab);
      }
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      renderCoupons();
      updateSavings();
      updateWalletCounts();
      
      // Filter chips
      filterChips.forEach(chip => {
        chip.addEventListener('click', () => {
          filterChips.forEach(c => c.classList.remove('filter-chip--active'));
          chip.classList.add('filter-chip--active');
          currentFilter = chip.dataset.filter;
          renderCoupons(currentFilter);
        });
      });
      
      // Wallet button
      document.getElementById('wallet-btn').addEventListener('click', () => {
        switchView(currentView === 'browse' ? 'wallet' : 'browse');
      });
      
      // Wallet tabs
      document.querySelectorAll('.wallet-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.wallet-tab').forEach(t => t.classList.remove('wallet-tab--active'));
          tab.classList.add('wallet-tab--active');
          currentWalletTab = tab.dataset.tab;
          renderWallet(currentWalletTab);
        });
      });
      
      // Modal close
      document.getElementById('modal-close').addEventListener('click', closeCouponModal);
      couponModal.addEventListener('click', (e) => {
        if (e.target === couponModal) closeCouponModal();
      });
      
      // Redeem
      document.getElementById('redeem-btn').addEventListener('click', redeemCoupon);
      document.getElementById('confirm-ok').addEventListener('click', confirmRedeem);
      document.getElementById('confirm-cancel').addEventListener('click', () => {
        confirmModal.classList.remove('confirm-modal--active');
      });
      
      // Terms toggle
      document.getElementById('terms-toggle').addEventListener('click', () => {
        const content = document.getElementById('terms-content');
        content.classList.toggle('coupon-modal__terms-content--visible');
      });
      
      // Code copy
      document.getElementById('modal-code').addEventListener('click', function() {
        navigator.clipboard.writeText(this.textContent).then(() => {
          showToast('コードをコピーしました');
        });
      });
      
      // Share
      document.getElementById('share-btn').addEventListener('click', () => {
        const text = `ダナンナビで${formatJPY(totalSavings)}もお得に！🎉`;
        if (navigator.share) {
          navigator.share({ title: 'DaNangNavi', text });
        } else {
          navigator.clipboard.writeText(text).then(() => {
            showToast('シェアテキストをコピーしました');
          });
        }
      });
      
      console.log('[DaNangNavi] Page 03.3 Deals & Coupons loaded');
    });
  </script>
</body>
</html>
